<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>BubbleX.pl - Serwer MultiOgar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #050608;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #fff;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 6, 8, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .modal-card {
      background: #11141f;
      width: 400px;
      padding: 30px 28px 24px 28px;
      border-radius: 20px;
      border: 1px solid #23293d;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 210, 255, 0.15);
      text-align: center;
    }

    .brand-title {
      font-size: 34px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
      text-align: left;
    }
    .brand-title span { color: #00d2ff; }

    .brand-tagline {
      font-size: 13px;
      color: #7e8ea8;
      text-align: left;
      margin-bottom: 20px;
    }

    .row-inputs {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .input-nick {
      flex: 1.4;
      padding: 11px 14px;
      background: #090b12;
      border: 1px solid #23293d;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      color: #ffffff;
    }
    .input-nick:focus { border-color: #00d2ff; }

    .select-rank {
      flex: 1;
      padding: 11px 10px;
      background: #090b12;
      border: 1px solid #23293d;
      border-radius: 8px;
      color: #ffd700;
      font-size: 12px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

    .mode-container {
      margin-bottom: 14px;
      text-align: left;
    }
    .mode-label {
      display: block;
      font-size: 11px;
      color: #7e8ea8;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .select-mode {
      width: 100%;
      padding: 11px 12px;
      background: #090b12;
      border: 1px solid #23293d;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      color: #00d2ff;
      font-weight: 600;
      cursor: pointer;
    }
    .select-mode:focus { border-color: #00d2ff; }

    .action-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-play {
      flex: 1;
      padding: 13px;
      background: #00d2ff;
      border: none;
      border-radius: 8px;
      color: #06080f;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-play:hover { background: #33dcff; }
    .btn-play:disabled { background: #555; cursor: not-allowed; }

    .controls-hint {
      font-size: 12px;
      color: #7e8ea8;
      line-height: 1.6;
      margin-bottom: 16px;
      background: rgba(9, 11, 18, 0.7);
      padding: 10px;
      border-radius: 8px;
    }
    .controls-hint strong { color: #00d2ff; }

    #server-status {
      font-size: 12px;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .status-connecting { color: #ffd700; }
    .status-connected { color: #00ff88; }
    .status-error { color: #ff3344; }

    #score-hud {
      position: absolute;
      top: 20px;
      left: 25px;
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      display: none;
      z-index: 10;
    }

    #leaderboard {
      position: absolute;
      top: 20px;
      right: 25px;
      background: rgba(17, 20, 31, 0.85);
      border: 1px solid #23293d;
      border-radius: 10px;
      padding: 12px 16px;
      width: 210px;
      display: none;
      z-index: 10;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    #leaderboard h3 {
      font-size: 14px;
      font-weight: 800;
      color: #00d2ff;
      text-align: center;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #leaderboard ol {
      list-style-position: inside;
      padding: 0;
      margin: 0;
    }
    #leaderboard li {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      color: #cbd5e1;
      font-weight: 600;
    }
    #leaderboard li.me {
      color: #00d2ff;
      font-weight: 800;
    }

    /* Czat gry – lewa krawędź, pionowo na środku ekranu. */
    #game-chat {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      width: min(340px, calc(100vw - 48px));
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 12;
      pointer-events: none;
    }
    #chat-messages {
      max-height: 180px;
      overflow-y: auto;
      padding: 10px 12px;
      border: 1px solid rgba(63, 83, 112, 0.35);
      border-radius: 10px;
      background: rgba(7, 11, 20, 0.68);
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      pointer-events: auto;
      scrollbar-width: thin;
      scrollbar-color: #44536c transparent;
    }
    .chat-line { margin: 3px 0; color: #f1f5f9; }
    .chat-name { font-weight: 800; }
    .chat-system { color: #a3b4cb; }
    #chat-input {
      display: none;
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #00d2ff;
      border-radius: 8px;
      outline: none;
      color: #ffffff;
      background: rgba(9, 14, 24, 0.94);
      font: 14px Arial, sans-serif;
      user-select: text;
      pointer-events: auto;
    }
    #chat-input::placeholder { color: #94a3b8; }

    canvas { display: block; }
  </style>
</head>
<body>

  <div class="overlay" id="menuOverlay">
    <div class="modal-card">
      <div class="brand-title">Bubble<span>X</span>.pl</div>
      <div class="brand-tagline">Wybierz tryb gry i dołącz do zabawy</div>

      <div id="server-status" class="status-connecting">Łączenie z serwerem gry...</div>

      <div class="mode-container">
        <span class="mode-label">Tryb rozgrywki</span>
        <select class="select-mode" id="modeSelect" onchange="switchMode(this.value)">
          <option value="wss://bubblex-server.onrender.com">Tryb FFA (Standard)</option>
          <option value="wss://bubblex-megasplit.onrender.com">MegaSplit (Instant Merge / 64 Kulek)</option>
          <option value="wss://bubblex-hardcore.onrender.com">Hardcore (Większa Masa / Walka)</option>
          <option value="wss://bubblex-experimental.onrender.com">Experimental (Wirusy-Matki)</option>
        </select>
      </div>

      <div class="row-inputs">
        <input type="text" class="input-nick" id="nick" maxlength="15" placeholder="Twój nick...">
        <select class="select-rank" id="rankSelect">
          <option value="PLAYER">Ranga: Gracz</option>
          <option value="VIP">Ranga: [VIP]</option>
          <option value="SVIP" selected>Ranga: [SVIP] 👑</option>
          <option value="ADMIN">Ranga: [ADMIN] 🔥</option>
        </select>
      </div>

      <div class="action-row">
        <button class="btn-play" id="btnPlay" disabled>CZEKAJ NA SERWER...</button>
      </div>

      <div class="controls-hint">
        Myszka: <strong>Kierunek ruchu</strong><br>
        <strong>Spacja</strong>: Podział masy | <strong>W</strong>: Jeden wyrzut | <strong>E</strong>: Makro (wolniej)<br>
        <strong>Enter</strong>: Czat | <strong>Esc</strong>: Zamknij czat
      </div>
    </div>
  </div>

  <div id="score-hud">Masa: <span id="scoreVal">0</span></div>

  <div id="leaderboard">
    <h3>TOP 10</h3>
    <ol id="lbList"></ol>
  </div>

  <div id="game-chat" aria-label="Czat gry">
    <div id="chat-messages" role="log" aria-label="Wiadomości graczy"></div>
    <input type="text" id="chat-input" maxlength="64"
           placeholder="Napisz wiadomość i naciśnij Enter..." autocomplete="off"
           aria-label="Wpisz wiadomość na czacie">
  </div>

  <canvas id="cvs"></canvas>

  <script>
    const cvs = document.getElementById("cvs");
    const ctx = cvs.getContext("2d");

    function resize() {
      cvs.width = window.innerWidth;
      cvs.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    let ws = null;
    let isConnected = false;
    let isAlive = false;
    let reconnectTimeout = null;
    let currentServerUrl = "wss://bubblex-server.onrender.com";

    // Obsługa makro pod W / E
    let ejectInterval = null;
    let isEjecting = false;

    // Przechowalnia encji z serwera
    let nodes = {};
    let myCellIds = new Set();
    let leaderboard = [];

    // Płynna kamera: aktualny widok i docelowa pozycja/zoom z serwera.
    let viewX = 0;
    let viewY = 0;
    let viewZoom = 1.0;
    let targetViewX = 0;
    let targetViewY = 0;
    let targetViewZoom = 1.0;
    let cameraReady = false;
    let lastCameraFrame = null;

    // Pozycja kursora myszy
    let mouseX = cvs.width / 2;
    let mouseY = cvs.height / 2;

    window.addEventListener("mousemove", (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      sendTarget();
    });

    function sendEject() {
      if (isAlive && isConnected) {
        sendUint8(21);
      }
    }

    function startEjecting() {
      if (isEjecting) return;
      isEjecting = true;
      sendEject();
      ejectInterval = setInterval(sendEject, 70);
    }

    function stopEjecting() {
      isEjecting = false;
      if (ejectInterval) {
        clearInterval(ejectInterval);
        ejectInterval = null;
      }
    }

    // Czat zgodny z protokołem MultiOgarII v5: identyfikator 99, flagi, UTF-16LE.
    const chatPanel = document.getElementById("game-chat");
    const chatMessages = document.getElementById("chat-messages");
    const chatInput = document.getElementById("chat-input");
    let chatOpen = false;

    function openChat() {
      if (!isConnected || !isAlive) return;
      stopEjecting();
      chatOpen = true;
      chatInput.style.display = "block";
      chatInput.focus();
    }

    function closeChat() {
      chatOpen = false;
      chatInput.value = "";
      chatInput.style.display = "none";
      chatInput.blur();
    }

    function submitChat() {
      const message = chatInput.value.trim().slice(0, 64);
      // Serwer ma własny limit wiadomości (około jednej na sekundę).
      if (message && isConnected && ws && ws.readyState === WebSocket.OPEN) {
        const buffer = new ArrayBuffer(2 + (message.length + 1) * 2);
        const data = new DataView(buffer);
        data.setUint8(0, 99); // Czat
        data.setUint8(1, 0);  // Flagi wiadomości
        for (let i = 0; i < message.length; i++) {
          data.setUint16(2 + i * 2, message.charCodeAt(i), true);
        }
        data.setUint16(2 + message.length * 2, 0, true);
        ws.send(buffer);
      }
      closeChat();
    }

    function readChatString(view, startOffset) {
      let content = "";
      for (let p = startOffset; p + 1 < view.byteLength; p += 2) {
        const code = view.getUint16(p, true);
        if (code === 0) return { content, next: p + 2 };
        content += String.fromCharCode(code);
      }
      return null; // Niewłaściwy / niepełny pakiet
    }

    function appendChatMessage(name, message, isServer, color) {
      if (!message) return;
      const line = document.createElement("div");
      line.className = "chat-line" + (isServer ? " chat-system" : "");
      const sender = document.createElement("span");
      sender.className = "chat-name";
      sender.style.color = isServer ? "#94a3b8" : color;
      sender.textContent = name + ": ";
      const content = document.createElement("span");
      content.textContent = message; // Bez interpretowania HTML wpisanego przez graczy.
      line.append(sender, content);
      chatMessages.appendChild(line);
      while (chatMessages.children.length > 80) chatMessages.firstChild.remove();
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    window.addEventListener("keydown", (e) => {
      if (e.isComposing) return;
      if (e.code === "Enter" && isAlive && isConnected) {
        e.preventDefault();
        if (e.repeat) return;
        if (chatOpen) submitChat();
        else openChat();
        return;
      }
      if (chatOpen) {
        if (e.code === "Escape") {
          e.preventDefault();
          closeChat();
        }
        return; // Podczas pisania W, E i spacja nie sterują kulką.
      }
      if (!isAlive || !isConnected) return;
      if (e.code === "Space") {
        sendUint8(17);
      } else if (e.code === "KeyW") {
        if (!e.repeat) sendEject(); // Jeden wyrzut na naciśnięcie W
      } else if (e.code === "KeyE") {
        startEjecting(); // Ciągły wyrzut przy trzymaniu E
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "KeyE") {
        stopEjecting();
      }
    });

    // Zatrzymaj makro E po przejściu do innej karty lub okna.
    window.addEventListener("blur", stopEjecting);

    const statusEl = document.getElementById("server-status");
    const btnPlay = document.getElementById("btnPlay");

    function connect(serverUrl) {
      if (reconnectTimeout) {
        clearTimeout(reconnectTimeout);
        reconnectTimeout = null;
      }

      currentServerUrl = serverUrl || currentServerUrl;
      closeChat();
      chatPanel.style.display = "none";
      chatMessages.replaceChildren(); // Nie mieszaj czatów różnych trybów gry.
      cameraReady = false; // Po zmianie serwera ustaw kamerę od razu przy pierwszym pakiecie.
      lastCameraFrame = null;
      statusEl.textContent = "Łączenie z serwerem...";
      statusEl.className = "status-connecting";
      btnPlay.textContent = "CZEKAJ NA SERWER...";
      btnPlay.disabled = true;

      nodes = {};
      myCellIds.clear();
      leaderboard = [];

      try {
        ws = new WebSocket(currentServerUrl);
        ws.binaryType = "arraybuffer";
      } catch (err) {
        statusEl.textContent = "Błąd adresu serwera!";
        statusEl.className = "status-error";
        return;
      }

      ws.onopen = () => {
        isConnected = true;
        statusEl.textContent = "Połączono z serwerem gry!";
        statusEl.className = "status-connected";
        btnPlay.textContent = "GRAJ TERAZ";
        btnPlay.disabled = false;

        const buf = new ArrayBuffer(5);
        const view = new DataView(buf);
        view.setUint8(0, 254);
        view.setUint32(1, 5, true);
        ws.send(buf);

        const buf2 = new ArrayBuffer(5);
        const view2 = new DataView(buf2);
        view2.setUint8(0, 255);
        view2.setUint32(1, 0, true);
        ws.send(buf2);
      };

      ws.onmessage = (e) => {
        handleServerMessage(new DataView(e.data));
      };

      ws.onclose = () => {
        isConnected = false;
        isAlive = false;
        stopEjecting();
        closeChat();
        chatPanel.style.display = "none";
        statusEl.textContent = "Brak połączenia. Wybudzanie serwera w chmurze...";
        statusEl.className = "status-error";
        btnPlay.textContent = "BRAK SERWERA";
        btnPlay.disabled = true;
        document.getElementById("menuOverlay").style.display = "flex";
        document.getElementById("score-hud").style.display = "none";
        document.getElementById("leaderboard").style.display = "none";
        reconnectTimeout = setTimeout(() => connect(currentServerUrl), 2500);
      };

      ws.onerror = () => {
        if (ws) ws.close();
      };
    }

    function switchMode(newUrl) {
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      stopEjecting();
      connect(newUrl);
    }

    function sendUint8(val) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const buf = new ArrayBuffer(1);
      new DataView(buf).setUint8(0, val);
      ws.send(buf);
    }

    function sendTarget() {
      if (!isAlive || !isConnected || !ws || ws.readyState !== WebSocket.OPEN) return;

      // Kierunek myszy liczony względem AKTUALNEJ pozycji kamery z serwera.
      // Nie używamy wygładzonej pozycji (viewX/viewY), bo jej opóźnienie
      // powodowałoby nieprecyzyjne sterowanie przy płynnej kamerze.
      const cameraX = cameraReady ? targetViewX : viewX;
      const cameraY = cameraReady ? targetViewY : viewY;
      const cameraZoom = cameraReady ? targetViewZoom : viewZoom;
      if (!Number.isFinite(cameraZoom) || cameraZoom <= 0) return;
      const targetX = cameraX + (mouseX - cvs.width / 2) / cameraZoom;
      const targetY = cameraY + (mouseY - cvs.height / 2) / cameraZoom;

      const buf = new ArrayBuffer(13);
      const view = new DataView(buf);
      view.setUint8(0, 16);
      view.setInt32(1, targetX, true);
      view.setInt32(5, targetY, true);
      view.setUint32(9, 0, true);
      ws.send(buf);
    }

    // Ponawiaj cel ruchu, nawet jeśli kursor myszy pozostaje nieruchomy.
    // Ponieważ kamera przesuwa się razem z graczem, cel w świecie gry
    // również musi się przesuwać. Inaczej kulka dociera do starego punktu i staje.
    setInterval(sendTarget, 50);

    function sendSpawn(nick) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;

      const buf = new ArrayBuffer(1 + (nick.length + 1) * 2);
      const view = new DataView(buf);
      view.setUint8(0, 0);

      for (let i = 0; i < nick.length; i++) {
        view.setUint16(1 + i * 2, nick.charCodeAt(i), true);
      }
      view.setUint16(1 + nick.length * 2, 0, true);

      ws.send(buf);
    }

    function handleServerMessage(view) {
      let offset = 0;
      const packetId = view.getUint8(offset++);

      switch (packetId) {
        case 16: {
          const eatCount = view.getUint16(offset, true);
          offset += 2;
          for (let i = 0; i < eatCount; i++) {
            offset += 8;
          }

          while (true) {
            const id = view.getUint32(offset, true);
            offset += 4;
            if (id === 0) break;

            const x = view.getInt32(offset, true);
            offset += 4;
            const y = view.getInt32(offset, true);
            offset += 4;
            const size = view.getInt16(offset, true);
            offset += 2;

            const r = view.getUint8(offset++);
            const g = view.getUint8(offset++);
            const b = view.getUint8(offset++);
            const flags = view.getUint8(offset++);

            const isVirus = !!(flags & 1);
            if (flags & 2) offset += 4;
            if (flags & 4) {
              while (view.getUint8(offset++) !== 0) {}
            }

            let name = "";
            while (true) {
              const charCode = view.getUint16(offset, true);
              offset += 2;
              if (charCode === 0) break;
              name += String.fromCharCode(charCode);
            }

            // Zachowaj wyswietlana pozycje pomiedzy aktualizacjami serwera.
            // Bez tego kulki przeskakuja skokowo, gdy kamera jest plynna.
            const previousNode = nodes[id];
            nodes[id] = {
              id, x, y, size,
              renderX: previousNode ? previousNode.renderX : x,
              renderY: previousNode ? previousNode.renderY : y,
              renderSize: previousNode ? previousNode.renderSize : size,
              color: `rgb(${r},${g},${b})`,
              isVirus,
              name: name || (previousNode ? previousNode.name : "")
            };
          }

          const removeCount = view.getUint32(offset, true);
          offset += 4;
          for (let i = 0; i < removeCount; i++) {
            const removeId = view.getUint32(offset, true);
            offset += 4;
            delete nodes[removeId];
            myCellIds.delete(removeId);
          }

          if (isAlive && myCellIds.size === 0) {
            isAlive = false;
            stopEjecting();
            closeChat();
            chatPanel.style.display = "none";
            document.getElementById("menuOverlay").style.display = "flex";
            document.getElementById("score-hud").style.display = "none";
            document.getElementById("leaderboard").style.display = "none";
          }
          break;
        }

        case 17: {
          targetViewX = view.getFloat32(offset, true);
          offset += 4;
          targetViewY = view.getFloat32(offset, true);
          offset += 4;
          targetViewZoom = view.getFloat32(offset, true) / 1.32;

          // Pierwszy pakiet: bez animacji z (0, 0) do gracza.
          if (!cameraReady) {
            viewX = targetViewX;
            viewY = targetViewY;
            viewZoom = targetViewZoom;
            cameraReady = true;
          }
          break;
        }

        case 32: {
          const myId = view.getUint32(offset, true);
          myCellIds.add(myId);
          isAlive = true;
          document.getElementById("menuOverlay").style.display = "none";
          document.getElementById("score-hud").style.display = "block";
          document.getElementById("leaderboard").style.display = "block";
          chatPanel.style.display = "flex";
          break;
        }

        case 99: {
          // Wiadomość od gracza lub komunikat serwera.
          if (view.byteLength < 5) break;
          const flags = view.getUint8(offset++);
          const r = view.getUint8(offset++);
          const g = view.getUint8(offset++);
          const b = view.getUint8(offset++);
          const sender = readChatString(view, offset);
          if (!sender) break;
          const message = readChatString(view, sender.next);
          if (!message) break;
          appendChatMessage(sender.content, message.content,
            !!(flags & 0x80), `rgb(${r},${g},${b})`);
          break;
        }

        case 49: {
          const count = view.getUint32(offset, true);
          offset += 4;
          leaderboard = [];
          for (let i = 0; i < count; i++) {
            const isMe = view.getUint32(offset, true);
            offset += 4;
            let name = "";
            while (true) {
              const charCode = view.getUint16(offset, true);
              offset += 2;
              if (charCode === 0) break;
              name += String.fromCharCode(charCode);
            }
            leaderboard.push({ name: name || "Bezimienny", isMe: !!isMe });
          }
          updateLeaderboardDisplay();
          break;
        }
      }
    }

    function updateLeaderboardDisplay() {
      const lbList = document.getElementById("lbList");
      lbList.innerHTML = "";
      leaderboard.slice(0, 10).forEach((item, index) => {
        const li = document.createElement("li");
        if (item.isMe) li.className = "me";
        li.innerHTML = `<span>${index + 1}. ${item.name}</span>`;
        lbList.appendChild(li);
      });
    }

    function drawVirus(x, y, r) {
      const spikes = 22;
      const step = (Math.PI * 2) / spikes;
      ctx.save();
      ctx.beginPath();
      for (let i = 0; i < spikes; i++) {
        const radius = (i % 2 === 0) ? r + 6 : r - 4;
        const angle = i * step;
        const vx = x + Math.cos(angle) * radius;
        const vy = y + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(vx, vy);
        else ctx.lineTo(vx, vy);
      }
      ctx.closePath();
      ctx.fillStyle = "#33e033";
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#1b8a1b";
      ctx.stroke();
      ctx.restore();
    }

    function render(frameTime) {
      // Animacja niezależna od FPS: kamera łagodnie podąża za serwerem.
      const deltaMs = lastCameraFrame === null
        ? 16.67
        : Math.min(Math.max(frameTime - lastCameraFrame, 0), 50);
      lastCameraFrame = frameTime;

      // Wspolne tempo wygładzania ruchu kamery i kulek.
      const moveSmooth = 1 - Math.exp(-deltaMs / 95);
      if (cameraReady) {
        const zoomSmooth = 1 - Math.exp(-deltaMs / 220);
        viewX += (targetViewX - viewX) * moveSmooth;
        viewY += (targetViewY - viewY) * moveSmooth;
        viewZoom += (targetViewZoom - viewZoom) * zoomSmooth;
      }

      ctx.clearRect(0, 0, cvs.width, cvs.height);

      ctx.save();
      ctx.translate(cvs.width / 2, cvs.height / 2);
      ctx.scale(viewZoom, viewZoom);
      ctx.translate(-viewX, -viewY);

      // Siatka tła
      ctx.strokeStyle = "#141926";
      ctx.lineWidth = 1;
      const gridSize = 60;
      const startX = Math.floor((viewX - cvs.width / (2 * viewZoom)) / gridSize) * gridSize;
      const endX = Math.ceil((viewX + cvs.width / (2 * viewZoom)) / gridSize) * gridSize;
      const startY = Math.floor((viewY - cvs.height / (2 * viewZoom)) / gridSize) * gridSize;
      const endY = Math.ceil((viewY + cvs.height / (2 * viewZoom)) / gridSize) * gridSize;

      ctx.beginPath();
      for (let x = startX; x <= endX; x += gridSize) {
        ctx.moveTo(x, startY);
        ctx.lineTo(x, endY);
      }
      for (let y = startY; y <= endY; y += gridSize) {
        ctx.moveTo(startX, y);
        ctx.lineTo(endX, y);
      }
      ctx.stroke();

      let totalMass = 0;

      // Sortowanie wszystkich encji od najmniejszej do największej (rosnąco)
      // Dzięki temu mniejsza kulka rysuje się PIERWSZA (jest pod spodem), 
      // a większy wirus lub gracz rysuje się NA NIEJ.
      const sortedNodes = Object.values(nodes).sort((a, b) => a.size - b.size);

      for (const node of sortedNodes) {
        // Interpoluj ruch obiektow w kazdej klatce zamiast rysowac je
        // tylko w pozycjach z ostatniego pakietu sieciowego.
        // Szybsza reakcja własnych kulek bez rezygnowania z wygładzania.
        // Pozostałe obiekty pozostają wygładzane łagodniej.
        const nodeMoveSmooth = myCellIds.has(node.id)
          ? 1 - Math.exp(-deltaMs / 50)
          : 1 - Math.exp(-deltaMs / 120);
        node.renderX += (node.x - node.renderX) * nodeMoveSmooth;
        node.renderY += (node.y - node.renderY) * nodeMoveSmooth;
        node.renderSize += (node.size - node.renderSize) * (1 - Math.exp(-deltaMs / 90));
        const drawX = node.renderX;
        const drawY = node.renderY;
        const drawSize = node.renderSize;

        if (node.isVirus) {
          drawVirus(drawX, drawY, drawSize);
        } else {
          ctx.beginPath();
          ctx.arc(drawX, drawY, drawSize, 0, Math.PI * 2);
          ctx.fillStyle = node.color;
          ctx.fill();

          if (node.size > 14) {
            ctx.lineWidth = Math.max(2, drawSize * 0.05);
            ctx.strokeStyle = "rgba(0,0,0,0.15)";
            ctx.stroke();
          }

          if (node.size >= 18) {
            const mass = Math.round((node.size * node.size) / 100);
            const fontSize = Math.max(10, Math.floor(drawSize * 0.3));

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#ffffff";
            ctx.font = `bold ${fontSize}px Arial`;

            if (node.name) {
              ctx.fillText(node.name, drawX, drawY - fontSize * 0.3);
              ctx.font = `bold ${Math.max(9, Math.floor(fontSize * 0.75))}px Arial`;
              ctx.fillStyle = "rgba(255,255,255,0.85)";
              ctx.fillText(mass, drawX, drawY + fontSize * 0.6);
            } else {
              ctx.fillText(mass, drawX, drawY);
            }
          }

          if (myCellIds.has(node.id)) {
            totalMass += Math.round((node.size * node.size) / 100);
          }
        }
      }

      ctx.restore();

      if (isAlive) {
        document.getElementById("scoreVal").textContent = totalMass;
      }

      requestAnimationFrame(render);
    }

    btnPlay.addEventListener("click", () => {
      if (!isConnected || !ws || ws.readyState !== WebSocket.OPEN) return;

      const inputVal = document.getElementById("nick").value.trim();
      const rawNick = inputVal.length > 0 ? inputVal : "Gracz";
      const rank = document.getElementById("rankSelect").value;

      let finalNick = rawNick;
      if (rank === "VIP") finalNick = `[VIP] ${rawNick}`;
      else if (rank === "SVIP") finalNick = `[SVIP] ${rawNick}`;
      else if (rank === "ADMIN") finalNick = `[ADMIN] ${rawNick}`;

      sendSpawn(finalNick);
    });

    connect(document.getElementById("modeSelect").value);
    requestAnimationFrame(render);
  </script>
</body>
</html>
